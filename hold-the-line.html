<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hold the Line — GPX route follower</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E9E1;
    --paper-2:#DDE0D6;
    --ink:#15181B;
    --ink-2:#5A6169;
    --route:#1B34C4;
    --rider:#D8E020;
    --alert:#C4321B;
    --rule:rgba(21,24,27,.14);
    --pad:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    display:flex;align-items:baseline;gap:10px;
    padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) 10px;
    border-bottom:1px solid var(--rule);
    background:var(--paper);
  }
  .wordmark{
    font-family:"Barlow Condensed",sans-serif;
    font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;
    white-space:nowrap;
  }
  .wordmark .thin{font-weight:500;color:var(--ink-2)}
  #routeName{
    font-size:11px;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
    text-align:right;
  }

  /* ---------- map ---------- */
  #mapWrap{flex:1 1 auto;position:relative;min-height:0}
  #map{position:absolute;inset:0;background:var(--paper-2)}
  .leaflet-container{font-family:"IBM Plex Mono",monospace;background:var(--paper-2)}
  .leaflet-control-attribution{font-size:9px;background:rgba(231,233,225,.82)}

  /* map buttons */
  .mapctl{
    position:absolute;right:10px;z-index:500;
    display:flex;flex-direction:column;gap:6px;
  }
  .mapctl{top:10px}
  .btn{
    font-family:"Barlow Condensed",sans-serif;
    font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;
    background:var(--paper);color:var(--ink);
    border:1px solid var(--ink);border-radius:0;
    padding:8px 11px;cursor:pointer;line-height:1;
    box-shadow:2px 2px 0 rgba(21,24,27,.18);
  }
  .btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(21,24,27,.18)}
  .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .btn:focus-visible{outline:3px solid var(--route);outline-offset:2px}

  /* ---------- empty state ---------- */
  #drop{
    position:absolute;inset:0;z-index:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:28px;text-align:center;
    background:var(--paper);
  }
  #drop.hide{display:none}
  #drop.over{background:var(--paper-2)}
  .dropRule{width:64px;height:2px;background:var(--ink)}
  #drop h2{
    font-family:"Barlow Condensed",sans-serif;font-weight:600;
    font-size:26px;letter-spacing:.03em;margin:0;max-width:22ch;line-height:1.15;
  }
  #drop p{margin:0;font-size:12px;line-height:1.65;color:var(--ink-2);max-width:36ch}

  /* ---------- deviation gauge (signature) ---------- */
  #gauge{
    flex:0 0 auto;
    padding:12px var(--pad) 10px;
    border-top:1px solid var(--rule);
    background:var(--paper);
  }
  .gaugeHead{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"Barlow Condensed",sans-serif;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
    margin-bottom:7px;
  }
  #offVal{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;color:var(--ink);letter-spacing:0}
  #offVal.off{color:var(--alert)}
  .track{position:relative;height:26px}
  .track .rail{position:absolute;top:12px;left:0;right:0;height:2px;background:var(--rule)}
  .track .center{position:absolute;top:4px;left:50%;width:2px;height:18px;background:var(--ink);transform:translateX(-1px)}
  .track .tick{position:absolute;top:9px;width:1px;height:8px;background:var(--rule)}
  #needle{
    position:absolute;top:0;left:50%;width:4px;height:26px;background:var(--route);
    transform:translateX(-2px);transition:transform .28s ease-out,background .2s;
  }
  #needle.off{background:var(--alert)}
  .trackLabels{
    display:flex;justify-content:space-between;
    font-size:9px;color:var(--ink-2);letter-spacing:.1em;margin-top:2px;
  }

  /* ---------- elevation ---------- */
  #elevWrap{flex:0 0 auto;padding:0 var(--pad);background:var(--paper)}
  #elevWrap.hide{display:none}
  #elev{display:block;width:100%;height:44px}

  /* ---------- data strip ---------- */
  #data{
    flex:0 0 auto;
    display:grid;grid-template-columns:repeat(4,1fr);
    border-top:1px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--paper);
  }
  .field{padding:11px 6px 13px;text-align:center;border-left:1px solid var(--rule)}
  .field:first-child{border-left:0}
  .field .lab{
    font-family:"Barlow Condensed",sans-serif;font-weight:600;
    font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2);
    display:block;margin-bottom:3px;
  }
  .field .val{font-weight:600;font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .field .unit{font-size:10px;color:var(--ink-2);margin-left:2px;font-weight:400}

  /* ---------- status ---------- */
  #status{
    flex:0 0 auto;font-size:11px;line-height:1.5;padding:8px var(--pad);
    background:var(--ink);color:var(--paper);
  }
  #status.hide{display:none}
  #status b{color:var(--rider)}
  #status button{
    font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;
    background:none;border:1px solid var(--paper);color:var(--paper);
    padding:3px 8px;margin-left:8px;cursor:pointer;
  }

  .rider-dot{
    width:18px;height:18px;border-radius:50%;
    background:var(--rider);border:3px solid var(--ink);
    box-shadow:0 0 0 2px rgba(231,233,225,.9);
  }
  @media (prefers-reduced-motion:reduce){
    #needle{transition:none}
  }
  @media (max-width:340px){
    .field .val{font-size:16px}
  }
</style>
</head>
<body>

<header>
  <span class="wordmark">Hold <span class="thin">the</span> Line</span>
  <span id="routeName">no route loaded</span>
</header>

<div id="mapWrap">
  <div id="map"></div>

  <div class="mapctl">
    <button class="btn" id="followBtn" aria-pressed="true">Follow</button>
    <button class="btn" id="fitBtn">Whole route</button>
    <button class="btn" id="layerBtn">Satellite</button>
    <button class="btn" id="loadBtn">Load GPX</button>
  </div>

  <div id="drop">
    <div class="dropRule"></div>
    <h2>Drop a GPX file, or tap Load GPX</h2>
    <p>The route draws on the map and your position follows it. No turn cues — just the line and how far you are from it.</p>
    <button class="btn" id="loadBtn2">Load GPX</button>
  </div>
</div>

<div id="gauge">
  <div class="gaugeHead">
    <span>Distance off line</span>
    <span id="offVal">—</span>
  </div>
  <div class="track" id="track">
    <div class="rail"></div>
    <div class="tick" style="left:25%"></div>
    <div class="tick" style="left:75%"></div>
    <div class="center"></div>
    <div id="needle"></div>
  </div>
  <div class="trackLabels"><span>LEFT OF ROUTE</span><span>RIGHT OF ROUTE</span></div>
</div>

<div id="elevWrap" class="hide"><svg id="elev" preserveAspectRatio="none"></svg></div>

<div id="data">
  <div class="field"><span class="lab">Done</span><span class="val" id="fDone">—</span></div>
  <div class="field"><span class="lab">To go</span><span class="val" id="fTogo">—</span></div>
  <div class="field"><span class="lab">Climb left</span><span class="val" id="fClimb">—</span></div>
  <div class="field"><span class="lab">Speed</span><span class="val" id="fSpeed">—</span></div>
</div>

<div id="status" class="hide"><span id="statusText"></span></div>

<input type="file" id="fileInput" accept=".gpx,application/gpx+xml,application/xml,text/xml" style="display:none" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  var USE_IMPERIAL = true;
  var OFF_ROUTE_M  = 30;      // beyond this, the needle goes red
  var GAUGE_MAX_M  = 60;      // needle pinned at the edge here

  /* ---------- map ---------- */
  var map = L.map('map', { zoomControl:false, attributionControl:true })
             .setView([38.92,-77.06], 12);
  L.control.zoom({position:'bottomleft'}).addTo(map);

  var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:19, attribution:'Imagery &copy; Esri'
  });
  var satOn = false;

  var routeLine=null, routeCasing=null, riderMarker=null, accCircle=null, snapMarker=null;

  /* ---------- state ---------- */
  var pts=[], cum=[], climbCum=[], totalM=0, totalClimb=0;
  var following=true, lastFix=null, watchId=null, wakeLock=null;

  /* ---------- geo helpers ---------- */
  function hav(a,b){
    var R=6371000, p1=a.lat*Math.PI/180, p2=b.lat*Math.PI/180;
    var dp=(b.lat-a.lat)*Math.PI/180, dl=(b.lon-a.lon)*Math.PI/180;
    var s=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
    return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
  }
  // local planar projection anchored at a reference latitude
  function xy(p, ref){
    return {
      x:(p.lon-ref.lon)*Math.cos(ref.lat*Math.PI/180)*111320,
      y:(p.lat-ref.lat)*110540
    };
  }

  /* ---------- GPX ---------- */
  function parseGPX(text){
    var doc = new DOMParser().parseFromString(text,'application/xml');
    if(doc.querySelector('parsererror')) throw new Error('That file is not valid XML.');

    var nodes = doc.getElementsByTagName('trkpt');
    if(!nodes.length) nodes = doc.getElementsByTagName('rtept');
    if(!nodes.length) nodes = doc.getElementsByTagName('wpt');
    if(!nodes.length) throw new Error('No track, route, or waypoints found in that file.');

    var out=[];
    for(var i=0;i<nodes.length;i++){
      var la=parseFloat(nodes[i].getAttribute('lat'));
      var lo=parseFloat(nodes[i].getAttribute('lon'));
      if(isNaN(la)||isNaN(lo)) continue;
      var e=nodes[i].getElementsByTagName('ele')[0];
      out.push({lat:la, lon:lo, ele:e?parseFloat(e.textContent):null});
    }
    if(out.length<2) throw new Error('That file has fewer than two points.');

    var nm = doc.querySelector('trk > name, rte > name, metadata > name');
    return { name: nm ? nm.textContent.trim() : 'Untitled route', points: out };
  }

  function buildRoute(name, points){
    pts = points;
    cum=[0]; climbCum=[0]; totalM=0; totalClimb=0;
    var smoothed=[], win=5;
    for(var i=0;i<pts.length;i++){
      var s=0,n=0;
      for(var j=Math.max(0,i-win); j<=Math.min(pts.length-1,i+win); j++){
        if(pts[j].ele!=null){ s+=pts[j].ele; n++; }
      }
      smoothed.push(n?s/n:null);
    }
    for(var k=1;k<pts.length;k++){
      totalM += hav(pts[k-1],pts[k]);
      cum.push(totalM);
      if(smoothed[k]!=null && smoothed[k-1]!=null){
        var d=smoothed[k]-smoothed[k-1];
        if(d>0) totalClimb+=d;
      }
      climbCum.push(totalClimb);
    }

    var latlngs = pts.map(function(p){return [p.lat,p.lon];});
    if(routeCasing) map.removeLayer(routeCasing);
    if(routeLine)   map.removeLayer(routeLine);
    routeCasing = L.polyline(latlngs,{color:'#E7E9E1',weight:9,opacity:.95,lineJoin:'round'}).addTo(map);
    routeLine   = L.polyline(latlngs,{color:'#1B34C4',weight:4,opacity:1,lineJoin:'round'}).addTo(map);

    L.circleMarker(latlngs[0],{radius:6,color:'#15181B',weight:2,fillColor:'#E7E9E1',fillOpacity:1})
      .addTo(routeLine._map).bindTooltip('Start');
    L.circleMarker(latlngs[latlngs.length-1],{radius:6,color:'#15181B',weight:2,fillColor:'#15181B',fillOpacity:1})
      .addTo(routeLine._map).bindTooltip('Finish');

    map.fitBounds(routeLine.getBounds(),{padding:[28,28]});
    document.getElementById('routeName').textContent =
      name + ' · ' + fmtDist(totalM) + ' · ' + fmtClimb(totalClimb) + ' climb';
    document.getElementById('drop').classList.add('hide');

    drawElevation(smoothed);
    update();
  }

  /* ---------- nearest point on route ---------- */
  function nearest(pos){
    var best={dist:Infinity, along:0, side:0, lat:pos.lat, lon:pos.lon};
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var A=xy(a,a), B=xy(b,a), P=xy(pos,a);
      var vx=B.x-A.x, vy=B.y-A.y;
      var len2=vx*vx+vy*vy;
      var t = len2>0 ? ((P.x-A.x)*vx+(P.y-A.y)*vy)/len2 : 0;
      t = Math.max(0, Math.min(1, t));
      var cx=A.x+t*vx, cy=A.y+t*vy;
      var d=Math.hypot(P.x-cx, P.y-cy);
      if(d<best.dist){
        var cross = vx*(P.y-A.y) - vy*(P.x-A.x); // >0 = left of travel direction
        best={
          dist:d,
          along:cum[i-1]+t*(cum[i]-cum[i-1]),
          side: cross>0 ? -1 : 1,   // -1 draws needle left
          lat: a.lat + cy/110540,
          lon: a.lon + cx/(Math.cos(a.lat*Math.PI/180)*111320),
          idx: i-1
        };
      }
    }
    return best;
  }

  /* ---------- formatting ---------- */
  function fmtDist(m){
    return USE_IMPERIAL ? (m/1609.344).toFixed(1)+' mi' : (m/1000).toFixed(1)+' km';
  }
  function distVal(m){ return USE_IMPERIAL ? (m/1609.344).toFixed(1) : (m/1000).toFixed(1); }
  function distUnit(){ return USE_IMPERIAL ? 'mi' : 'km'; }
  function fmtClimb(m){ return USE_IMPERIAL ? Math.round(m*3.28084)+' ft' : Math.round(m)+' m'; }
  function fmtOff(m){
    if(USE_IMPERIAL){
      var ft=m*3.28084;
      return ft<1000 ? Math.round(ft)+' ft' : (ft/5280).toFixed(2)+' mi';
    }
    return m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(2)+' km';
  }
  function setField(id,val,unit){
    document.getElementById(id).innerHTML = val + (unit?'<span class="unit">'+unit+'</span>':'');
  }

  /* ---------- elevation profile ---------- */
  var elevPath=null, elevMark=null;
  function drawElevation(smoothed){
    var svg=document.getElementById('elev'), wrap=document.getElementById('elevWrap');
    var has = smoothed.some(function(v){return v!=null;});
    if(!has){ wrap.classList.add('hide'); return; }
    wrap.classList.remove('hide');
    svg.innerHTML='';
    var W=1000,H=100;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    var lo=Infinity, hi=-Infinity;
    smoothed.forEach(function(v){ if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v); }});
    var span=Math.max(1,hi-lo);
    var d='M 0 '+H;
    for(var i=0;i<pts.length;i++){
      if(smoothed[i]==null) continue;
      var x=(cum[i]/totalM)*W;
      var y=H-((smoothed[i]-lo)/span)*(H-12)-6;
      d+=' L '+x.toFixed(1)+' '+y.toFixed(1);
    }
    d+=' L '+W+' '+H+' Z';
    svg.insertAdjacentHTML('beforeend',
      '<path d="'+d+'" fill="rgba(27,52,196,.13)" stroke="#1B34C4" stroke-width="2" vector-effect="non-scaling-stroke"/>'+
      '<line id="elevMark" x1="0" y1="0" x2="0" y2="'+H+'" stroke="#15181B" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0"/>');
    elevMark=svg.querySelector('#elevMark');
  }

  /* ---------- render ---------- */
  function update(){
    if(!pts.length) return;
    if(!lastFix){
      setField('fDone','—'); setField('fTogo', distVal(totalM), distUnit());
      setField('fClimb', USE_IMPERIAL?Math.round(totalClimb*3.28084):Math.round(totalClimb), USE_IMPERIAL?'ft':'m');
      return;
    }
    var n = nearest(lastFix);

    // gauge
    var frac = Math.min(1, n.dist/GAUGE_MAX_M) * n.side;
    var needle=document.getElementById('needle');
    needle.style.transform='translateX(-2px) translateX('+(frac*50)+'%)';
    needle.style.left = (50 + frac*45) + '%';
    var offEl=document.getElementById('offVal');
    offEl.textContent = fmtOff(n.dist) + (n.dist>4 ? (n.side<0?' L':' R') : '');
    var isOff = n.dist > OFF_ROUTE_M;
    needle.classList.toggle('off', isOff);
    offEl.classList.toggle('off', isOff);

    // fields
    setField('fDone', distVal(n.along), distUnit());
    setField('fTogo', distVal(Math.max(0,totalM-n.along)), distUnit());
    var climbLeft = Math.max(0, totalClimb - (climbCum[n.idx]||0));
    setField('fClimb', USE_IMPERIAL?Math.round(climbLeft*3.28084):Math.round(climbLeft), USE_IMPERIAL?'ft':'m');
    if(lastFix.speed!=null && !isNaN(lastFix.speed)){
      setField('fSpeed', (USE_IMPERIAL? lastFix.speed*2.23694 : lastFix.speed*3.6).toFixed(1), USE_IMPERIAL?'mph':'kph');
    } else setField('fSpeed','—');

    // elevation marker
    if(elevMark){
      var x=(n.along/totalM)*1000;
      elevMark.setAttribute('x1',x); elevMark.setAttribute('x2',x); elevMark.setAttribute('opacity','1');
    }

    // snap indicator
    if(!snapMarker){
      snapMarker = L.circleMarker([n.lat,n.lon],{radius:4,color:'#1B34C4',weight:2,fillColor:'#E7E9E1',fillOpacity:1}).addTo(map);
    } else snapMarker.setLatLng([n.lat,n.lon]);
  }

  function setPosition(lat,lon,acc,speed){
    lastFix={lat:lat,lon:lon,speed:speed};
    if(!riderMarker){
      riderMarker=L.marker([lat,lon],{
        icon:L.divIcon({className:'',html:'<div class="rider-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),
        zIndexOffset:1000
      }).addTo(map);
    } else riderMarker.setLatLng([lat,lon]);

    if(acc!=null){
      if(!accCircle) accCircle=L.circle([lat,lon],{radius:acc,color:'#1B34C4',weight:1,opacity:.4,fillOpacity:.06}).addTo(map);
      else { accCircle.setLatLng([lat,lon]); accCircle.setRadius(acc); }
    }
    if(following) map.panTo([lat,lon],{animate:true,duration:.5});
    update();
  }

  /* ---------- status bar ---------- */
  function say(html, withRetry){
    var s=document.getElementById('status');
    document.getElementById('statusText').innerHTML = html +
      (withRetry ? ' <button id="retryGeo">Retry</button>' : '');
    s.classList.remove('hide');
    var r=document.getElementById('retryGeo');
    if(r) r.onclick=startGeo;
  }
  function hideStatus(){ document.getElementById('status').classList.add('hide'); }

  /* ---------- geolocation ---------- */
  function startGeo(){
    if(!('geolocation' in navigator)){
      say('This browser has no location access. Tap the map to place your position by hand.');
      return;
    }
    if(watchId!=null) navigator.geolocation.clearWatch(watchId);
    say('Waiting for a GPS fix…');
    watchId = navigator.geolocation.watchPosition(function(p){
      hideStatus();
      setPosition(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.coords.speed);
    }, function(err){
      var msg = err.code===1 ? 'Location permission was denied. Allow it in your browser settings, or tap the map to place your position by hand.'
              : err.code===2 ? 'No GPS signal yet. This can take a minute outdoors.'
              : 'Location timed out.';
      say(msg, true);
    }, {enableHighAccuracy:true, maximumAge:2000, timeout:20000});
  }

  map.on('click', function(e){
    if(!pts.length) return;
    setPosition(e.latlng.lat, e.latlng.lng, null, null);
    hideStatus();
  });

  /* ---------- wake lock ---------- */
  async function keepAwake(){
    try{
      if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); }
    }catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible') keepAwake();
  });

  /* ---------- file loading ---------- */
  var fileInput=document.getElementById('fileInput');
  function pick(){ fileInput.click(); }
  document.getElementById('loadBtn').onclick=pick;
  document.getElementById('loadBtn2').onclick=pick;

  fileInput.onchange=function(){
    var f=fileInput.files && fileInput.files[0];
    if(f) readFile(f);
    fileInput.value='';
  };

  function readFile(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var g=parseGPX(r.result);
        buildRoute(g.name, g.points);
        save(g.name, r.result);
        keepAwake();
        if(!lastFix) startGeo();
      }catch(e){
        say('Could not read that file: '+e.message);
      }
    };
    r.onerror=function(){ say('Could not read that file.'); };
    r.readAsText(file);
  }

  var drop=document.getElementById('drop');
  ['dragenter','dragover'].forEach(function(ev){
    document.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    document.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove('over'); });
  });
  document.addEventListener('drop',function(e){
    var f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) readFile(f);
  });

  /* ---------- remember the last route ---------- */
  async function save(name,text){
    try{
      if(typeof window.storage!=='undefined' && window.storage){
        await window.storage.set('route:last', JSON.stringify({name:name,gpx:text}));
      }
    }catch(e){}
  }
  async function restore(){
    try{
      if(typeof window.storage==='undefined' || !window.storage) return;
      var r=await window.storage.get('route:last');
      if(r && r.value){
        var o=JSON.parse(r.value);
        var g=parseGPX(o.gpx);
        buildRoute(g.name, g.points);
        startGeo();
      }
    }catch(e){}
  }

  /* ---------- controls ---------- */
  var fb=document.getElementById('followBtn');
  fb.onclick=function(){
    following=!following;
    fb.setAttribute('aria-pressed', following?'true':'false');
    if(following && lastFix) map.panTo([lastFix.lat,lastFix.lon]);
  };
  map.on('dragstart',function(){ following=false; fb.setAttribute('aria-pressed','false'); });

  document.getElementById('fitBtn').onclick=function(){
    if(routeLine) map.fitBounds(routeLine.getBounds(),{padding:[28,28]});
    following=false; fb.setAttribute('aria-pressed','false');
  };

  var lb=document.getElementById('layerBtn');
  lb.onclick=function(){
    satOn=!satOn;
    if(satOn){ map.removeLayer(streets); sat.addTo(map); lb.textContent='Streets'; }
    else { map.removeLayer(sat); streets.addTo(map); lb.textContent='Satellite'; }
    if(routeCasing){ routeCasing.bringToFront(); routeLine.bringToFront(); }
  };

  // tap the gauge label to flip units
  document.querySelector('.gaugeHead').onclick=function(){
    USE_IMPERIAL=!USE_IMPERIAL;
    if(pts.length) document.getElementById('routeName').textContent =
      document.getElementById('routeName').textContent.split(' · ')[0] +
      ' · ' + fmtDist(totalM) + ' · ' + fmtClimb(totalClimb) + ' climb';
    update();
  };

  restore();
})();
</script>
</body>
</html>
